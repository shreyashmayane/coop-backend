name: customer_app
description: Cooperative Gig Services — Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & networking
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location (mobile only — comment out for web builds)
  geolocator: ^11.0.0

  # Firebase (comment out until google-services.json is added)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.10

  # Payments (mobile only — comment out for web builds)
  # razorpay_flutter: ^1.3.6

  # UI enhancements
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.20.3

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  # Fonts are loaded via google_fonts package at runtime — no local .ttf files needed
